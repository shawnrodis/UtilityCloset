[package]
name = "utility_closet_core"
version = "1.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "utility_closet_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
