name: Build Windows

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build Rust core (utility_closet_core.dll)
        run: cargo build --release --manifest-path rust/Cargo.toml
      - name: Generate Windows runner and use repo app code
        run: |
          flutter create --platforms=windows --project-name utility_closet_flutter app
          Copy-Item -Force -Recurse lib/* app/lib/
          Copy-Item -Force pubspec.yaml app/pubspec.yaml
          # Admin behaviour (egui used a requireAdministrator manifest):
          # patch the generated runner manifest from asInvoker to
          # requireAdministrator, and use the app icon if present.
          $manifest = Get-ChildItem app/windows/runner -Filter *.manifest | Select-Object -First 1
          if ($manifest) {
            (Get-Content $manifest.FullName) -replace 'level="asInvoker"', 'level="requireAdministrator"' | Set-Content $manifest.FullName
          }
          if (Test-Path assets/UtilityCloset.ico) {
            Copy-Item -Force assets/UtilityCloset.ico app/windows/runner/resources/app_icon.ico
          }
          # Window title: flutter create names the native window after the
          # project (utility_closet_flutter) — replace it with the app name,
          # otherwise the title bar / taskbar shows the project slug.
          $mainCpp = 'app/windows/runner/main.cpp'
          if (Test-Path $mainCpp) {
            (Get-Content $mainCpp -Raw) -replace 'utility_closet_flutter', 'Utility Closet' | Set-Content $mainCpp
          }
      - name: Build Windows release
        run: |
          cd app
          flutter pub get
          flutter build windows --release
      - name: Copy Rust core DLL into the Release folder
        run: |
          Copy-Item -Force rust/target/release/utility_closet_core.dll app/build/windows/x64/runner/Release/
          if (-not (Test-Path 'app/build/windows/x64/runner/Release/utility_closet_core.dll')) { throw 'utility_closet_core.dll missing — Rust core build failed, do not ship a pure-Dart build' }
          Get-ChildItem app/build/windows/x64/runner/Release/
      - name: Zip the Release folder (exe alone will not run)
        run: |
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath UtilityCloset-Windows.zip
      - name: Build NSIS installer
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y }
          $env:PATH += ';C:\Program Files (x86)\NSIS'
          Copy-Item -Recurse -Force app/build/windows/x64/runner/Release installer/staging
          cd installer
          makensis installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: utility-closet-windows
          path: |
            UtilityCloset-Windows.zip
            installer/UtilityCloset-Setup-v1.1.2.exe
