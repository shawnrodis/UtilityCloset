name: utility_closet_flutter
description: "The Utility Closet — Rust core + Flutter UI. All-in-one Windows maintenance: network drives, printers, repairs, annoyances, backup and restore."
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  http: ^1.2.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
